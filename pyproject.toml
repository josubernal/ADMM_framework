[project]
name = "snn-admm-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib>=3.10.1",
    "snntorch>=0.9.4",
    "tonic>=1.6.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "pandas"
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true


[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.0.3",
]
