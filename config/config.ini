[affine]
# OPTIONS ARE: "linear", "conv", "spiking-linear", "spiking-conv"
model= spiking-conv
# ================== GENERAL PARAMS ======================
batch_size = 50
epochs = 20
warming_iters = 6

gamma = 0.1
beta = 1.0

# ============== SPIKING PARAMS ==================
n_timesteps = 150
deltas = 0.95
thetas = 0.3

# =================== LINEAR PARAMS =====================
hidden_dims=100

# =================== CONV PARAMS =====================
hidden_channels=4
kernel_size=5
padding=2
stride=2

# =================== OTHER CONF. ======================
# OPTIONS ARE: "zeros-rng", "zeros", "xavier"
init=zeros
#True raises an Exception, because I have not checked that everything works properly yet.
bias=False 
#OPTIONS ARE: "vectorized", "urolled-sequential" and "unrolled-random"
train_method=unrolled-sequential
#Set false
use_double=False