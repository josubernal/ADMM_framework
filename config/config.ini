[affine]
# OPTIONS ARE: "linear", "conv", "spiking-linear", "spiking-conv"
model= spiking-conv
# ================== GENERAL PARAMS ======================
batch_size = 20
epochs = 100
warming_iters = 40

beta = 0.1
rho = 1.0

# ============== SPIKING PARAMS ==================
n_timesteps = 150
deltas = 0.95
thetas = 0.3

# =================== LINEAR PARAMS =====================
hidden_dims=50

# =================== CONV PARAMS =====================
hidden_channels=2
kernel_size=5
padding=2
stride=1

# =================== OTHER CONF. ======================
# OPTIONS ARE: "zeros-rng", "zeros", "xavier","zeros-pass"
init=zeros
#True raises an Exception, because I have not checked that everything works properly yet.
bias=False 
#OPTIONS ARE: "vectorized", "unrolled-random", "unrolled-sequential", "hybrid-random", "hybrid-sequential"
train_method=vectorized
#Set false
use_double=False