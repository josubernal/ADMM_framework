[config]
#OPTIONS ARE: linear, conv, spiking-linear, spiking-conv
model = spiking-linear, spiking-conv
layers = 2

batch_size = 30
epochs = 30
warming_iters = 15

beta = 0.1
rho = 1.0

n_timesteps = 150
deltas = 0.95
thetas = 0.3

hidden_dims = 70

hidden_channels = 2
kernel_size = 5
padding = 2
stride = 2

# OPTIONS ARE: "zeros-rng", "zeros", "xavier","zeros-pass"
init = zeros

#OPTIONS ARE: "vectorized", "unrolled-random", "unrolled-sequential", "decoupled-random", "decoupled-sequential"
train_method = unrolled-random, vectorized, decoupled-random

bias = False, True
use_double = False


