[config]
#OPTIONS ARE: linear, conv, spiking-linear, spiking-conv
model = spiking-linear
#OPTIONS ARE: 2,3
layers = 2

batch_size = 30
epochs = 10
warming_iters = 0

beta = 0.1
rho = 1.0

n_timesteps = 150
deltas = 0.95
thetas = 0.3

hidden_dims = 70

hidden_channels = 2
kernel_size = 5
padding = 2
stride = 1

# OPTIONS ARE: "zeros-rng", "zeros", "xavier","zeros-pass"
init = zeros
#OPTIONS ARE: "vectorized", "unrolled-random", "unrolled-sequential", "decoupled-random", "decoupled-sequential"
train_method = unrolled-sequential, decoupled-sequential

bias = False
use_double = False
use_fft = True
padding_mode = circular